name: Claude-distilled 2B CPU benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Qwen3.5 2B Claude-distilled (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache llama.cpp compiler objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-claude-2b-llama-${{ github.sha }}
          restore-keys: |
            linux-claude-2b-llama-

      - name: Build llama.cpp with native CPU optimizations
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: |
          ccache --max-size=2G
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=ON \
            -DGGML_OPENMP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build llama.cpp/build --config Release --target llama-server --parallel "$(nproc)"
          ccache --show-stats

      - name: Install cpai
        run: python -m pip install -e .

      - name: Record runner and model
        run: |
          mkdir -p results
          {
            echo "runner=$(uname -a)"
            echo "architecture=$(uname -m)"
            echo "cpu=$(lscpu | grep -E 'Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket' | tr '\n' ';')"
            echo "model=Jackrong/Qwen3.5-2B-Claude-4.6-Opus-Reasoning-Distilled-GGUF:Q4_K_M"
            echo "quantization=Q4_K_M"
            echo "build_flags=GGML_NATIVE=ON,GGML_OPENMP=ON,Release"
            echo "llama_cpp_commit=$(git -C llama.cpp rev-parse HEAD)"
          } | tee results/environment.txt

      - name: Stability benchmark (fixed best configuration)
        env:
          OMP_DYNAMIC: "FALSE"
          OMP_PROC_BIND: close
          OMP_PLACES: cores
          CPAI_LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
        run: |
          python -m cpai.benchmark \
            --model "Jackrong/Qwen3.5-2B-Claude-4.6-Opus-Reasoning-Distilled-GGUF:Q4_K_M" \
            --thread-candidates 4 \
            --threads-batch-candidates 2 \
            --cpu-strict-candidates 0 \
            --poll-candidates 0 \
            --poll-batch-candidates 1\
            --speculative-candidates none \
            --tokens 384 \
            --runs 9 \
            --batch-candidates 512 \
            --ubatch-candidates 128 \
            --output results/benchmark.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpai-claude-distilled-2b-benchmark
          path: results/
          if-no-files-found: warn
          retention-days: 30
