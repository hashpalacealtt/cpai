name: CPU inference benchmark

on:
  push:
    branches: [main]
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpai-cpu-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    name: CPU inference / optimized Qwen 1.5B
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ccache libcurl4-openssl-dev

      - name: Restore llama.cpp compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-llama-cpp-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-llama-cpp-ccache-

      - name: Configure compiler cache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Show runner CPU capabilities
        run: |
          lscpu
          grep -m1 '^flags' /proc/cpuinfo || true

      - name: Fetch pinned AVX2 kernel candidate
        run: |
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/silicium369-spec/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth=1 origin b77e97fcf3ab296391db149d9a38628913e181d6
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "b77e97fcf3ab296391db149d9a38628913e181d6"
          echo "llama.cpp candidate: $(git -C /tmp/llama.cpp rev-parse HEAD)"

      - name: Build llama.cpp with native AVX2 CPU kernels
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DGGML_NATIVE=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama.cpp/build --config Release -j4 --target llama-server test-quantize-fns test-backend-ops
          ctest --test-dir /tmp/llama.cpp/build --output-on-failure -R 'test-quantize-fns|test-backend-ops'
          ccache --show-stats

      - name: Benchmark optimized Qwen CPU engine
        env:
          CPAI_LLAMA_SERVER: /tmp/llama.cpp/build/bin/llama-server
        run: |
          python -m cpai.benchmark \
            --thread-candidates 2,4 \
            --batch-candidates 256 \
            --ubatch-candidates 256 \
            --tokens 256 \
            --runs 3 \
            --output results/ubuntu-latest-qwen2.5-1.5b-q4km-40tuning.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("results/ubuntu-latest-qwen2.5-1.5b-q4km-40tuning.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["engine_build"] = {
              "repository": "https://github.com/silicium369-spec/llama.cpp",
              "commit": "b77e97fcf3ab296391db149d9a38628913e181d6",
              "optimization": "x86 AVX2 quantized dot-product kernels",
          }
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpai-cpu-engine-benchmark
          path: results/
          if-no-files-found: ignore
          retention-days: 14
