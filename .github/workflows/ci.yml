name: CPU inference checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Fast unit tests (no model download, no benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests only
        run: python -m unittest discover -s tests -v
