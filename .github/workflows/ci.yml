name: CPU inference benchmark

on:
  push:
    branches: [main]
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpai-cpu-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    name: CPU inference / AVX2 thread validation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cpai unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ccache libcurl4-openssl-dev

      - name: Fingerprint runner CPU for safe native-code caching
        id: cpu
        run: |
          {
            lscpu | grep -E '^(Architecture|CPU\(s\)|Vendor ID|Model name|Thread\(s\) per core|Core\(s\) per socket):'
            grep -m1 '^flags' /proc/cpuinfo
          } > "$RUNNER_TEMP/cpu-info.txt"
          cp "$RUNNER_TEMP/cpu-info.txt" "$GITHUB_WORKSPACE/.ccache-cpu-info"
          fingerprint="$(sha256sum "$RUNNER_TEMP/cpu-info.txt" | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/cpu-info.txt"

      - name: Restore llama.cpp compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-llama-cpp-${{ steps.cpu.outputs.fingerprint }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-llama-cpp-${{ steps.cpu.outputs.fingerprint }}-

      - name: Configure compiler cache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Build and benchmark upstream baseline
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          git init /tmp/llama-baseline
          git -C /tmp/llama-baseline remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama-baseline fetch --depth=1 origin 7894e8b92481a8bb8ffe94f73b656ffe0dd01e10
          git -C /tmp/llama-baseline checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama-baseline rev-parse HEAD)" = "7894e8b92481a8bb8ffe94f73b656ffe0dd01e10"
          cmake -S /tmp/llama-baseline -B /tmp/llama-baseline/build \
            -DGGML_NATIVE=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_OPENMP=ON -DGGML_CURL=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama-baseline/build --config Release -j4 --target llama-server
          CPAI_LLAMA_SERVER=/tmp/llama-baseline/build/bin/llama-server \
            python -m cpai.benchmark \
              --thread-candidates 1,2,4 --batch-candidates 256 --ubatch-candidates 256 \
              --tokens 256 --runs 3 --output results/upstream-baseline.json

      - name: Build, test and benchmark AVX2 kernel PR
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          git init /tmp/llama-candidate
          git -C /tmp/llama-candidate remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama-candidate fetch --depth=1 origin refs/pull/31061/head
          git -C /tmp/llama-candidate checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama-candidate rev-parse HEAD)" = "b77e97fcf3ab296391db149d9a38628913e181d6"
          cmake -S /tmp/llama-candidate -B /tmp/llama-candidate/build \
            -DGGML_NATIVE=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_OPENMP=ON -DGGML_CURL=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama-candidate/build --config Release -j4 --target llama-server test-quantize-fns test-backend-ops
          ctest --test-dir /tmp/llama-candidate/build --output-on-failure -R 'test-quantize-fns'
          /tmp/llama-candidate/build/bin/test-backend-ops -b CPU -j 4 -o MUL_MAT
          CPAI_LLAMA_SERVER=/tmp/llama-candidate/build/bin/llama-server \
            python -m cpai.benchmark \
              --thread-candidates 1,2,4 --batch-candidates 256 --ubatch-candidates 256 \
              --tokens 256 --runs 3 --output results/avx2-kernel-candidate.json

      - name: Build and benchmark AVX-512 VNNI when supported
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          FLAGS="$(grep -m1 '^flags' /proc/cpuinfo)"
          if [[ " $FLAGS " != *" avx512f "* || " $FLAGS " != *" avx512_vnni "* ]]; then
            echo "Skipped: runner does not expose AVX-512F + AVX-512 VNNI." | tee results/avx512-skipped.txt
            exit 0
          fi
          cmake -S /tmp/llama-baseline -B /tmp/llama-avx512/build \
            -DGGML_NATIVE=ON -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON \
            -DGGML_AVX512_VBMI=ON -DGGML_AVX512_BF16=ON \
            -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_OPENMP=ON -DGGML_CURL=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama-avx512/build --config Release -j4 --target llama-server test-backend-ops
          /tmp/llama-avx512/build/bin/test-backend-ops -b CPU -j 4 -o MUL_MAT
          CPAI_LLAMA_SERVER=/tmp/llama-avx512/build/bin/llama-server \
            python -m cpai.benchmark \
              --thread-candidates 1,2,4 --batch-candidates 256 --ubatch-candidates 256 \
              --tokens 256 --runs 3 --output results/avx512-vnni.json

      - name: Benchmark 1.5B low-bit and 0.5B speed profiles
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
        run: |
          SERVER=/tmp/llama-baseline/build/bin/llama-server
          if [[ -x /tmp/llama-avx512/build/bin/llama-server ]]; then
            SERVER=/tmp/llama-avx512/build/bin/llama-server
          fi
          CPAI_LLAMA_SERVER="$SERVER" python -m cpai.benchmark \
            --model Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q2_K \
            --thread-candidates 1,2,4 --batch-candidates 256 --ubatch-candidates 256 \
            --tokens 256 --runs 3 --output results/qwen-1.5b-q2k.json
          CPAI_LLAMA_SERVER="$SERVER" python -m cpai.benchmark \
            --model Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M \
            --thread-candidates 1,2,4 --batch-candidates 256 --ubatch-candidates 256 \
            --tokens 256 --runs 3 --output results/qwen-0.5b-q4km.json

      - name: Benchmark speculative decoding with a 0.5B draft model
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
        run: |
          SERVER=/tmp/llama-baseline/build/bin/llama-server
          if [[ -x /tmp/llama-avx512/build/bin/llama-server ]]; then
            SERVER=/tmp/llama-avx512/build/bin/llama-server
          fi
          CPAI_LLAMA_SERVER="$SERVER" python -m cpai.benchmark \
            --model Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M \
            --draft-model Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M \
            --draft-tokens 8 --draft-threads 1 \
            --thread-candidates 1,2,4 --batch-candidates 256 --ubatch-candidates 256 \
            --tokens 256 --runs 3 --output results/qwen-1.5b-speculative-0.5b-draft.json

      - name: Compare identical-hardware benchmark results
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_EXTRAFILES: ${{ github.workspace }}/.ccache-cpu-info
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline_path = Path("results/upstream-baseline.json")
          candidate_path = Path("results/avx2-kernel-candidate.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          baseline["engine_build"] = {
              "repository": "https://github.com/ggml-org/llama.cpp",
              "commit": "7894e8b92481a8bb8ffe94f73b656ffe0dd01e10",
              "variant": "upstream baseline",
          }
          candidate["engine_build"] = {
              "repository": "https://github.com/ggml-org/llama.cpp",
              "pull_request": 31061,
              "commit": "b77e97fcf3ab296391db149d9a38628913e181d6",
              "variant": "AVX2 quantized dot-product kernel candidate",
          }
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")
          candidate_path.write_text(json.dumps(candidate, indent=2) + "\n", encoding="utf-8")

          def median(data):
              return float(data["best_configuration"]["summary"]["generation_tokens_per_second_median"])

          base_tps = median(baseline)
          candidate_tps = median(candidate)
          comparison = {
              "same_runner_cpu": baseline.get("cpu"),
              "baseline_best": baseline["best_configuration"],
              "avx2_best": candidate["best_configuration"],
              "baseline_median_tok_s": base_tps,
              "avx2_median_tok_s": candidate_tps,
              "avx2_delta_percent": round((candidate_tps / base_tps - 1.0) * 100.0, 2),
          }
          Path("results/ab-comparison.json").write_text(
              json.dumps(comparison, indent=2) + "\n", encoding="utf-8"
          )
          avx512_path = Path("results/avx512-vnni.json")
          if avx512_path.exists():
              avx512 = json.loads(avx512_path.read_text(encoding="utf-8"))
              avx512_tps = median(avx512)
              comparison["avx512_vnni_best"] = avx512["best_configuration"]
              comparison["avx512_vnni_median_tok_s"] = avx512_tps
              comparison["avx512_vnni_delta_vs_upstream_percent"] = round(
                  (avx512_tps / base_tps - 1.0) * 100.0, 2
              )
              comparison["avx512_vnni_delta_vs_avx2_percent"] = round(
                  (avx512_tps / candidate_tps - 1.0) * 100.0, 2
              )
          else:
              comparison["avx512_vnni"] = "skipped: unsupported CPU flags"

          for label, path in (
              ("qwen_1_5b_q2k", Path("results/qwen-1.5b-q2k.json")),
              ("qwen_0_5b_q4km", Path("results/qwen-0.5b-q4km.json")),
          ):
              if path.exists():
                  result = json.loads(path.read_text(encoding="utf-8"))
                  comparison[f"{label}_best"] = result["best_configuration"]
                  comparison[f"{label}_median_tok_s"] = median(result)

          speculative_path = Path("results/qwen-1.5b-speculative-0.5b-draft.json")
          if speculative_path.exists():
              speculative = json.loads(speculative_path.read_text(encoding="utf-8"))
              speculative_tps = median(speculative)
              comparison["speculative_1_5b_with_0_5b_draft_best"] = speculative["best_configuration"]
              comparison["speculative_1_5b_with_0_5b_draft_median_tok_s"] = speculative_tps
              comparison["speculative_delta_vs_q4km_baseline_percent"] = round(
                  (speculative_tps / base_tps - 1.0) * 100.0, 2
              )

          print(json.dumps(comparison, indent=2))
          PY
          ccache --show-stats

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpai-cpu-engine-benchmark
          path: results/
          if-no-files-found: ignore
          retention-days: 14
