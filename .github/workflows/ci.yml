name: CPU inference benchmark

on:
  push:
    branches: [main]
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpai-cpu-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    name: CPU inference / controlled AVX2 A-B
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cpai unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ccache libcurl4-openssl-dev

      - name: Restore llama.cpp compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-llama-cpp-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-llama-cpp-ccache-

      - name: Configure compiler cache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          ccache --show-stats

      - name: Show runner CPU capabilities
        run: |
          lscpu
          grep -m1 '^flags' /proc/cpuinfo || true

      - name: Build and benchmark upstream baseline
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          git init /tmp/llama-baseline
          git -C /tmp/llama-baseline remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama-baseline fetch --depth=1 origin 7894e8b92481a8bb8ffe94f73b656ffe0dd01e10
          git -C /tmp/llama-baseline checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama-baseline rev-parse HEAD)" = "7894e8b92481a8bb8ffe94f73b656ffe0dd01e10"
          cmake -S /tmp/llama-baseline -B /tmp/llama-baseline/build \
            -DGGML_NATIVE=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama-baseline/build --config Release -j4 --target llama-server
          CPAI_LLAMA_SERVER=/tmp/llama-baseline/build/bin/llama-server \
            python -m cpai.benchmark \
              --thread-candidates 2,4 \
              --batch-candidates 256 \
              --ubatch-candidates 256 \
              --tokens 256 \
              --runs 3 \
              --output results/upstream-baseline.json

      - name: Build, test and benchmark AVX2 kernel candidate
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          git init /tmp/llama-candidate
          git -C /tmp/llama-candidate remote add origin https://github.com/silicium369-spec/llama.cpp.git
          git -C /tmp/llama-candidate fetch --depth=1 origin b77e97fcf3ab296391db149d9a38628913e181d6
          git -C /tmp/llama-candidate checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama-candidate rev-parse HEAD)" = "b77e97fcf3ab296391db149d9a38628913e181d6"
          cmake -S /tmp/llama-candidate -B /tmp/llama-candidate/build \
            -DGGML_NATIVE=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama-candidate/build --config Release -j4 --target llama-server test-quantize-fns test-backend-ops
          ctest --test-dir /tmp/llama-candidate/build --output-on-failure -R 'test-quantize-fns'
          CPAI_LLAMA_SERVER=/tmp/llama-candidate/build/bin/llama-server \
            python -m cpai.benchmark \
              --thread-candidates 2,4 \
              --batch-candidates 256 \
              --ubatch-candidates 256 \
              --tokens 256 \
              --runs 3 \
              --output results/avx2-kernel-candidate.json

      - name: Compare identical-hardware benchmark results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline_path = Path("results/upstream-baseline.json")
          candidate_path = Path("results/avx2-kernel-candidate.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          baseline["engine_build"] = {
              "repository": "https://github.com/ggml-org/llama.cpp",
              "commit": "7894e8b92481a8bb8ffe94f73b656ffe0dd01e10",
              "variant": "upstream baseline",
          }
          candidate["engine_build"] = {
              "repository": "https://github.com/silicium369-spec/llama.cpp",
              "commit": "b77e97fcf3ab296391db149d9a38628913e181d6",
              "variant": "AVX2 quantized dot-product candidate",
          }
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")
          candidate_path.write_text(json.dumps(candidate, indent=2) + "\n", encoding="utf-8")

          def median(data):
              return float(data["best_configuration"]["summary"]["generation_tokens_per_second_median"])

          base_tps = median(baseline)
          candidate_tps = median(candidate)
          delta = (candidate_tps / base_tps - 1.0) * 100.0
          comparison = {
              "same_runner_cpu": baseline.get("cpu"),
              "baseline_median_tok_s": base_tps,
              "candidate_median_tok_s": candidate_tps,
              "delta_percent": round(delta, 2),
              "candidate_faster": candidate_tps > base_tps,
          }
          Path("results/ab-comparison.json").write_text(
              json.dumps(comparison, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(comparison, indent=2))
          PY
          ccache --show-stats

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpai-cpu-engine-benchmark
          path: results/
          if-no-files-found: ignore
          retention-days: 14
