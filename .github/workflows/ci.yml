name: CPU inference benchmark

on:
  push:
    branches: [main]
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cpai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpai-cpu-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-benchmark:
    name: CPU inference / optimized Qwen 1.5B
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev

      - name: Show runner CPU capabilities
        run: |
          lscpu
          grep -m1 '^flags' /proc/cpuinfo || true

      - name: Build llama.cpp with native CPU optimizations
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DGGML_NATIVE=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -flto -fomit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto"
          cmake --build /tmp/llama.cpp/build --config Release -j4 --target llama-server

      - name: Benchmark optimized Qwen CPU engine
        env:
          CPAI_LLAMA_SERVER: /tmp/llama.cpp/build/bin/llama-server
        run: |
          python -m cpai.benchmark \
            --thread-candidates 2,4 \
            --batch-candidates 256 \
            --ubatch-candidates 256 \
            --tokens 256 \
            --runs 3 \
            --output results/ubuntu-latest-qwen2.5-1.5b-q4km-40tuning.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpai-cpu-engine-benchmark
          path: results/
          if-no-files-found: ignore
          retention-days: 14
