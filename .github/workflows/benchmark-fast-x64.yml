name: Fast x64 CPU benchmark

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: cpai-fast-x64-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Ubuntu x64 fast benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp
      - name: Resolve llama.cpp revision
        id: llama
        run: echo \"sha=$(git -C llama.cpp rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"
      - name: Restore llama.cpp build cache
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: ${{ runner.os }}-${{ runner.arch }}-llama-${{ steps.llama.outputs.sha }}-native-openmp-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-llama-
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp
          key: ${{ runner.os }}-${{ runner.arch }}-cpai-model-qwen35-2b-q4km-v1
      - uses: actions/setup-python@v5
        with:
          python-version: \"3.12\"
          cache: pip
      - name: Build llama.cpp
        shell: bash
        run: |
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release --target llama-server --parallel 4
          echo \"CPAI_LLAMA_SERVER=$(find llama.cpp/build -type f -name llama-server | head -n 1)\" >> \"$GITHUB_ENV\"
      - name: Install cpai
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Record runner details
        run: mkdir -p results && lscpu | tee results/environment.txt
      - name: Run quick sweep (maximum 5 minutes)
        shell: bash
        env:
          OMP_DYNAMIC: \"FALSE\"
          OMP_PROC_BIND: close
          OMP_PLACES: cores
        run: |
          timeout --signal=TERM --kill-after=10s 300s python -m cpai.benchmark --model \"Jackrong/Qwen3.5-2B-Claude-4.6-Opus-Reasoning-Distilled-GGUF:Q4_K_M\" --thread-candidates 3,4 --threads-batch-candidates 2 --cpu-strict-candidates 0 --poll-candidates 0 --poll-batch-candidates 0,1 --speculative-candidates none --tokens 96 --runs 2 --batch-candidates 512 --ubatch-candidates 64 --output results/benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpai-fast-x64-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
