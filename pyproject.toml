[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpai"
version = "0.1.0"
description = "CPU-first inference runner and benchmark harness for small language models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cpai contributors" }]
dependencies = []

[project.scripts]
cpai-bench = "cpai.benchmark:main"

[tool.setuptools.packages.find]
include = ["cpai*"]
